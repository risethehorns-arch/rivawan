<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This page has flown — Rawan Roshni</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050A09">
<link rel="icon" href="/favicon.png" type="image/png">
<style>
@font-face{font-family:'Fraunces';font-style:normal;font-weight:200 600;font-display:swap;src:url('/assets/fonts/fraunces-roman.woff2') format('woff2')}
@font-face{font-family:'Manrope';font-style:normal;font-weight:300 700;font-display:swap;src:url('/assets/fonts/manrope.woff2') format('woff2')}
@font-face{font-family:'Aref Ruqaa';font-style:normal;font-weight:400;font-display:swap;src:url('/assets/fonts/arefruqaa-arabic.woff2') format('woff2');unicode-range:U+0600-06FF,U+FB50-FDFF,U+FE70-FEFC}
:root{--ground:#050A09;--bone:#EFE7DA;--ink:#54C7A8;--candle:#E9A55B}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground) radial-gradient(ellipse at 50% 38%,rgba(84,199,168,.13),rgba(5,10,9,0) 60%);color:var(--bone);font:400 16px/1.6 'Manrope',system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px;text-align:center}
main{max-width:520px}
img{width:132px;height:auto;opacity:.92;animation:float 7s ease-in-out infinite}
h1{font:300 clamp(34px,7vw,52px)/1.1 'Fraunces',Georgia,serif;letter-spacing:-.02em;margin:28px 0 6px}
.ar{font:400 28px/1.4 'Aref Ruqaa',serif;color:var(--ink);margin:0 0 18px}
p{margin:0 0 30px;color:rgba(239,231,218,.72)}
a{display:inline-block;padding:13px 26px;border:1px solid rgba(239,231,218,.35);border-radius:999px;color:var(--bone);text-decoration:none;font-size:13px;letter-spacing:.2em;text-transform:uppercase;transition:border-color .3s,color .3s}
a:hover,a:focus-visible{border-color:var(--candle);color:var(--candle);outline:none}
@keyframes float{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){img{animation:none}}
</style>
</head>
<body>
<main>
  <img src="/assets/img/logo-360.webp" alt="Rawan Roshni" width="180" height="185">
  <h1>This page has flown.</h1>
  <p class="ar" lang="ar" dir="rtl">طارت هذه الصفحة</p>
  <p>Whatever lived here has moved on. The rest of the garden is still singing.</p>
  <a href="/">Back to the garden</a>
</main>
</body>
</html>
